name: Study material checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run lab tests
        run: python3 -m unittest discover -s tests -v
      - name: Check practice content and local links
        run: python3 scripts/check_content.py
