name: Sandbox environment demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demonstrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: study-sandbox
    env:
      STUDY_MESSAGE: ${{ vars.STUDY_MESSAGE }}
    steps:
      - name: Write a sandbox summary
        shell: bash
        run: |
          message="${STUDY_MESSAGE:-No STUDY_MESSAGE variable was configured}"
          printf '## Environment practice\n\n%s\n\nNo application was deployed.\n' "$message" >> "$GITHUB_STEP_SUMMARY"
